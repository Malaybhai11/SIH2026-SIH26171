<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Scanned documents — DocLocker</title><link rel="stylesheet" href="demo.css"></head>
<body><header class="top"><b>📄 DocLocker</b><nav><a href="#">My Documents</a></nav></header>
<main>
<div class="card">
  <h2 style="margin-top:0">Uploaded documents</h2>
  <p class="muted">These images are scanned/photographed documents — the text inside them is
  drawn in pixels, not DOM text. Only on-device OCR (A1) can find PII here.</p>
  <div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:16px">
    <img src="img/ocr/id_card_1.png" alt="scanned ID" style="border:1px solid #e4e7ec;border-radius:6px">
    <img src="img/ocr/id_card_2.png" alt="scanned ID" style="border:1px solid #e4e7ec;border-radius:6px">
    <img src="img/ocr/receipt_1.png" alt="payment receipt" style="border:1px solid #e4e7ec;border-radius:6px">
  </div>
</div>
</main></body></html>
